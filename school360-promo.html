<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>School360 Qatar — promo</title>
<style>
:root{--maroon:#7A1F32;--maroon-d:#4E1220;--ink:#1E2430;--ink-2:#5B6474;--base:#F1F3F6;--line:#DFE3E9;--sand:#C9A96A;--ok:#1F8A4C;--ok-t:#E3F3E9;--warn:#C77A0E;--warn-t:#FBEFD9;--bad:#B42323;--bad-t:#F9E1E1;--info:#1F5FA8;--info-t:#E3ECF7;--maroon-t:#F4E6E9;
 font-family:"IBM Plex Sans","IBM Plex Sans Arabic","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0d0f14;color:var(--ink);overflow:hidden}
#wrap{position:fixed;inset:0;display:grid;place-items:center}
#stage{width:1920px;height:1080px;position:relative;overflow:hidden;background:var(--base);transform-origin:center;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.scene{position:absolute;inset:0;opacity:0;transition:opacity .5s;pointer-events:none}
.scene.on{opacity:1;pointer-events:auto}
/* captions */
#cap{position:absolute;left:0;right:0;bottom:70px;text-align:center;z-index:20;pointer-events:none}
#cap .en{font-size:38px;font-weight:600;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.45);letter-spacing:-.01em}
#cap .ar{font-size:36px;font-weight:600;color:var(--sand);direction:rtl;margin-top:6px;text-shadow:0 2px 12px rgba(0,0,0,.45);font-family:"IBM Plex Sans Arabic","Noto Sans Arabic","Segoe UI",system-ui}
.scene.light #cap-in .en{color:var(--ink);text-shadow:none}
/* progress + controls */
#bar{position:absolute;left:0;right:0;bottom:0;height:6px;background:rgba(0,0,0,.15);z-index:30}
#bar i{display:block;height:100%;width:0;background:var(--sand)}
#ctl{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:8px;z-index:50;opacity:.25;transition:opacity .2s;flex-wrap:wrap;justify-content:center}
@media(hover:none){#ctl{opacity:1}#ctl span{display:none}#ctl button{padding:12px 18px;font-size:16px}}
#rotate{position:fixed;inset:0;display:none;place-items:center;background:#0d0f14;color:#fff;z-index:90;text-align:center;font-size:20px;padding:30px;line-height:1.6}
@media(hover:none) and (orientation:portrait){#rotate{display:grid}}
#tap{position:fixed;inset:0;display:grid;place-items:center;background:rgba(13,15,20,.85);color:#fff;z-index:80;cursor:pointer;font-size:28px;text-align:center}
#tap b{display:block;font-size:44px;margin-bottom:10px}
#ctl:hover{opacity:1}
#ctl button{border:0;background:#fff;color:var(--ink);padding:8px 14px;border-radius:6px;font:inherit;cursor:pointer}
/* shared UI bits */
.dark{background:var(--maroon-d);color:#fff}
.mark{width:120px;height:120px;border-radius:26px;background:var(--sand);color:var(--maroon-d);font-weight:700;font-size:54px;display:grid;place-items:center}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px}
.h{font-size:96px;font-weight:600;letter-spacing:-.03em;line-height:1.05;text-align:center}
.h small{display:block;font-size:34px;font-weight:400;opacity:.8;letter-spacing:0;margin-top:14px}
.tile{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px 26px}
.tile .k{font-size:20px;color:var(--ink-2)}.tile .v{font-size:52px;font-weight:600;letter-spacing:-.02em;margin-top:4px}
.tag{display:inline-block;padding:4px 14px;border-radius:99px;font-size:20px;font-weight:600}
.ok{background:var(--ok-t);color:var(--ok)}.warn{background:var(--warn-t);color:var(--warn)}.bad{background:var(--bad-t);color:var(--bad)}.info{background:var(--info-t);color:var(--info)}
.phone{width:440px;height:900px;border-radius:48px;background:#111;padding:14px;box-shadow:0 40px 80px rgba(0,0,0,.35)}
.phone .scr{background:var(--base);border-radius:36px;height:100%;overflow:hidden;position:relative;font-size:19px}
.phone .hdr{background:var(--maroon);color:#fff;padding:50px 24px 20px}
.phone .hdr b{font-size:26px}
.card{background:#fff;border-radius:16px;padding:16px 18px;margin:12px 16px;border:1px solid var(--line)}
.notif{position:absolute;left:16px;right:16px;top:60px;background:#fff;border-radius:18px;padding:14px 18px;box-shadow:0 12px 30px rgba(0,0,0,.25);transform:translateY(-140px);opacity:0;transition:.5s cubic-bezier(.2,.9,.3,1.2);font-size:18px}
.notif.show{transform:none;opacity:1}
.notif b{display:block}
/* animations (kept to what the story needs) */
.pop{animation:pop .6s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
.rise{animation:rise .7s ease both}
@keyframes rise{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
.fadein{animation:fi .8s ease both}
@keyframes fi{from{opacity:0}to{opacity:1}}
.d1{animation-delay:.15s}.d2{animation-delay:.3s}.d3{animation-delay:.45s}.d4{animation-delay:.6s}.d5{animation-delay:.75s}.d6{animation-delay:.9s}.d7{animation-delay:1.05s}.d8{animation-delay:1.2s}
/* scene 1 chaos */
.chaos{position:absolute;inset:0}
.chaos .ic{position:absolute;width:150px;height:150px;border-radius:32px;display:grid;place-items:center;font-size:64px;background:#fff;box-shadow:0 20px 50px rgba(0,0,0,.25);transition:all 1.2s cubic-bezier(.6,0,.2,1)}
.chaos.collapse .ic{left:885px!important;top:465px!important;width:150px;height:150px;opacity:0;transform:scale(.3) rotate(0)!important}
/* pipeline */
.pipe{display:flex;gap:14px;align-items:center}
.pipe span{padding:12px 26px;border-radius:99px;background:#fff;border:1px solid var(--line);font-size:26px;color:var(--ink-2);transition:.4s}
.pipe span.on{background:var(--maroon);color:#fff;border-color:var(--maroon)}
.check div{font-size:30px;padding:12px 0;display:flex;gap:16px;align-items:center}
.check div i{width:36px;height:36px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;color:#fff;transition:.3s}
.check div.on i{background:var(--ok);border-color:var(--ok)}
.banner{background:var(--bad);color:#fff;font-size:34px;padding:24px 40px;border-radius:14px;display:flex;gap:18px;align-items:center}
.bus-timeline{font-size:30px}
.bus-timeline div{padding:14px 0 14px 40px;position:relative;color:var(--ink-2);transition:.4s}
.bus-timeline div:before{content:"";position:absolute;left:0;top:22px;width:22px;height:22px;border-radius:50%;border:3px solid var(--line);background:#fff}
.bus-timeline div.done{color:var(--ink)}.bus-timeline div.done:before{background:var(--ok);border-color:var(--ok)}
.bus-timeline div.live{color:var(--maroon);font-weight:600}.bus-timeline div.live:before{background:var(--maroon);border-color:var(--maroon);box-shadow:0 0 0 8px var(--maroon-t)}
.plan{background:#fff;border-radius:20px;padding:34px 38px;width:400px;text-align:center;color:var(--ink)}
.plan b{font-size:30px;display:block}.plan .p{font-size:44px;font-weight:600;color:var(--maroon);margin:10px 0}.plan small{font-size:20px;color:var(--ink-2)}
.plan.hi{outline:4px solid var(--sand)}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
 <div id="scenes"></div>
 <div id="cap"><div class="en" id="capEn"></div><div class="ar" id="capAr"></div></div>
 <div id="bar"><i id="barI"></i></div>
</div></div>
<div id="rotate">📱 ↻<br><b>Rotate your phone to landscape</b><br>to watch the School360 promo</div>
<div id="tap" onclick="startPlay()"><div><b>▶</b>School360 Qatar — promo<br><span style="font-size:18px;opacity:.8">Tap to play · 79 seconds</span></div></div>
<div id="ctl"><button onclick="toggle()" id="pp">Pause</button><button onclick="jump(-1)">◀ Prev</button><button onclick="jump(1)">Next ▶</button><button onclick="restart()">Restart</button><span style="color:#fff;font-size:12px;align-self:center;opacity:.8">Space = play/pause · ← → = scenes · F = fullscreen</span></div>

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);$("#stage").style.transform=`scale(${s})`}addEventListener("resize",fit);fit();
const tiles=(a)=>a.map(([k,v,c],i)=>`<div class="tile pop d${i+1}"><div class="k">${k}</div><div class="v" style="${c?'color:'+c:''}">${v}</div></div>`).join("");

/* ---------- scenes: {dur (ms), html, cap:[en,ar], run(el)} ---------- */
const SC=[
{dur:7000,cls:"dark",cap:["Nine systems. One school.","تسعة أنظمة. مدرسة واحدة."],
 html:`<div class="chaos" id="chaos">${[["💬",240,180,-12],["✉️",1500,160,9],["📊",420,700,6],["🧾",1450,720,-8],["🚌",1050,140,14],["📞",300,430,-5],["📋",1560,440,11],["📝",860,760,-9],["🏢",1180,470,4]].map(([e,x,y,r])=>`<div class="ic pop" style="left:${x}px;top:${y}px;transform:rotate(${r}deg)">${e}</div>`).join("")}</div>
       <div class="center" id="logo1" style="opacity:0;transition:opacity .8s"><div class="mark">S3</div><div class="h">School360<small>School Management • Parent Services • Facilities</small></div></div>`,
 run:el=>{setTimeout(()=>el.querySelector("#chaos").classList.add("collapse"),3200);setTimeout(()=>el.querySelector("#logo1").style.opacity=1,4000)}},

{dur:9000,cap:["Everything the school runs on — in one control panel.","كل ما تديره المدرسة — في لوحة تحكم واحدة."],
 html:`<div style="padding:70px 90px"><div class="rise" style="font-size:34px;color:var(--ink-2)">Good morning, Principal · Thursday, 3 September</div>
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:30px">${tiles([["Students","1,248"],["Attendance","96.4%"],["Teachers","126"],["Buses","24"],["Maintenance open","8"],["Cleaning score","94%"],["Outstanding fees","QR 485,200","var(--bad)"],["Emergency alerts","0","var(--ok)"]])}</div>
  <div class="rise d8" style="margin-top:28px;display:flex;gap:14px;font-size:26px"><span class="tag bad">Bus 21 breakdown — parents notified 7:12</span><span class="tag bad">Playground swing — work order #10481</span><span class="tag warn">Fire pump PPM due in 7 days</span></div></div>`},

{dur:14000,cap:["Parents see everything about their child — and know where the bus is.","يرى ولي الأمر كل ما يخص ابنه — ويعرف أين الحافلة."],
 html:`<div style="position:absolute;left:180px;top:70px" class="rise"><div class="phone"><div class="scr">
   <div class="hdr"><div style="opacity:.8">Good morning</div><b>Mr. Saleem</b></div>
   <div class="card"><b>Ahmed</b> · Grade 5A <span class="tag ok" style="font-size:16px">96%</span><div style="color:var(--ink-2);margin-top:6px">Maths · English · Science · Arabic · PE</div></div>
   <div class="card"><b>Aisha</b> · Grade 2B <span class="tag ok" style="font-size:16px">98%</span></div>
   <div class="card" style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;text-align:center;font-size:15px"><div>🚌<br>Bus</div><div>💰<br>Fees</div><div>📚<br>Homework</div><div>📊<br>Attendance</div><div>📢<br>News</div><div>💬<br>Teachers</div><div>📄<br>Documents</div><div>✦<br>Assistant</div></div>
   <div class="card"><b>Fees — Ahmed</b><div style="display:flex;justify-content:space-between;margin-top:6px"><span>Outstanding</span><b style="color:var(--bad)">QR 6,000</b></div><div style="color:var(--ink-2)">Due 15 September</div><div style="margin-top:10px;background:var(--maroon);color:#fff;text-align:center;border-radius:10px;padding:10px;font-weight:600">Pay now</div></div>
   <div class="notif" id="n1"><b>🚌 Bus #12 is 8 minutes away</b>Al Wakra – Al Wukair route</div>
   <div class="notif" id="n2"><b>✅ Ahmed boarded Bus #12</b>6:58 AM</div>
   <div class="notif" id="n3"><b>🏫 Ahmed arrived at school</b>7:42 AM</div>
  </div></div></div>
  <div style="position:absolute;left:760px;top:150px;width:980px" class="rise d3"><div style="background:var(--maroon);color:#fff;border-radius:22px;padding:34px 40px;display:flex;justify-content:space-between;align-items:center"><div><div style="font-size:26px;opacity:.85">School Bus #12 · Route 4</div><div style="font-size:88px;font-weight:600;letter-spacing:-.03em" id="eta">8</div><div style="font-size:26px;opacity:.85" id="etaL">minutes away</div></div><div style="font-size:120px">🚌</div></div>
   <div class="bus-timeline" style="margin-top:34px;background:#fff;border-radius:22px;padding:24px 40px" id="tl"><div class="done">Approaching your home · 6:50</div><div class="live">Bus arrived · 6:57</div><div>Ahmed boarded the bus</div><div>Ahmed arrived at school</div><div>Ahmed boarded the bus for home</div></div></div>`,
 run:el=>{const tl=el.querySelector("#tl").children,eta=el.querySelector("#eta"),etaL=el.querySelector("#etaL");
  setTimeout(()=>el.querySelector("#n1").classList.add("show"),1500);
  setTimeout(()=>{el.querySelector("#n1").classList.remove("show");eta.textContent="Arrived";eta.style.fontSize="64px";etaL.textContent=""},5500);
  setTimeout(()=>{el.querySelector("#n2").classList.add("show");tl[1].className="done";tl[2].className="live";tl[2].textContent="Ahmed boarded the bus · 6:58"},7000);
  setTimeout(()=>{el.querySelector("#n2").classList.remove("show");el.querySelector("#n3").classList.add("show");tl[2].className="done";tl[3].className="live";tl[3].textContent="Ahmed arrived at school · 7:42";eta.textContent="At school"},10500)}},

{dur:9000,cap:["Teachers mark attendance and homework once. Parents are notified instantly.","يسجّل المعلم الحضور والواجب مرة واحدة. ويصل الإشعار فوراً."],
 html:`<div style="padding:80px 100px;display:grid;grid-template-columns:1.1fr 1fr;gap:60px">
  <div class="rise"><div style="font-size:34px;font-weight:600;margin-bottom:18px">Grade 5A — Attendance · 7:45</div><div style="background:#fff;border-radius:22px;padding:10px 30px;font-size:30px" id="att">${["Ahmed Al-Kuwari","Mohammed Farooq","Sara Al-Mannai","Ali Ibrahim","Fatima Al-Thani","Yousef Mathew"].map(n=>`<div style="display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line)"><span>${n}</span><span class="tag" style="background:var(--base);color:var(--ink-2);min-width:70px;text-align:center">—</span></div>`).join("")}</div></div>
  <div class="rise d3"><div style="font-size:34px;font-weight:600;margin-bottom:18px">Assign homework</div><div style="background:#fff;border-radius:22px;padding:30px;font-size:28px;line-height:1.7"><div><span style="color:var(--ink-2)">Subject</span> &nbsp; Science</div><div><span style="color:var(--ink-2)">Title</span> &nbsp; Chapter 4 — Forces, Q1–10</div><div><span style="color:var(--ink-2)">Due</span> &nbsp; Sunday 6 September</div><div id="hwbtn" style="margin-top:18px;background:var(--maroon);color:#fff;display:inline-block;padding:12px 32px;border-radius:12px;font-weight:600;transition:.3s">Assign to 32 students</div></div>
   <div style="position:relative;height:200px"><div class="notif" id="n4" style="top:40px;font-size:24px;padding:20px 24px"><b>🔔 New homework assigned — Science</b>Ahmed · Due Sunday 6 Sep</div><div class="notif" id="n5" style="top:130px;font-size:24px;padding:20px 24px"><b>🔔 Sara was marked absent today</b>Grade 5A · 7:46 AM</div></div></div></div>`,
 run:el=>{const rows=el.querySelectorAll("#att .tag");["P","P","A","P","L","P"].forEach((v,i)=>setTimeout(()=>{rows[i].textContent=v;rows[i].className="tag "+(v==="P"?"ok":v==="A"?"bad":"warn")},900+i*450));
  setTimeout(()=>el.querySelector("#n5").classList.add("show"),4200);
  setTimeout(()=>{el.querySelector("#hwbtn").style.background="var(--ok)";el.querySelector("#hwbtn").textContent="Assigned ✓"},5200);
  setTimeout(()=>el.querySelector("#n4").classList.add("show"),5800)}},

{dur:14000,cap:["And the part nobody else offers: your buildings, assets and contractors — managed in the same app.","والميزة التي لا يقدمها غيرنا: مبانيكم وأصولكم ومقاولوكم — تُدار في التطبيق نفسه."],
 html:`<div style="padding:70px 100px">
  <div class="rise" style="font-size:40px;font-weight:600">Facilities command centre</div>
  <div style="display:grid;grid-template-columns:1.2fr 1fr;gap:50px;margin-top:30px">
   <div><div class="tile rise d1" style="font-size:28px"><div style="display:flex;justify-content:space-between"><div><b>Work order #10484</b> · HVAC · Block B / Room 204 📸<div style="color:var(--ink-2);font-size:22px">AC not cooling, room at 29°C · reported by Ms. Mariam 7:20 · SLA 4h</div></div><span class="tag bad">High</span></div>
    <div class="pipe" style="margin-top:20px" id="pipe"><span class="on">New</span><span>Assigned</span><span>In progress</span><span>Completed</span><span>Verified</span></div></div>
    <div class="tile rise d3" style="margin-top:22px;font-size:26px"><b style="font-size:30px">Preventive maintenance — due this month</b><div style="margin-top:12px;display:grid;grid-template-columns:1fr auto;gap:10px 30px"><span>FP-02 Fire pump set · SafeGuard FLS</span><span class="tag warn">10 Sep · 7 days</span><span>AC-204 / AC-205 · Cool Air Services</span><span class="tag warn">15 Sep</span><span>PG-03 Playground swing set</span><span class="tag bad">Overdue</span></div></div></div>
   <div class="tile rise d2"><b style="font-size:30px">Digital cleaning inspection — Building A / Canteen</b><div class="check" style="margin-top:14px" id="chk">${["Floors mopped","Tables wiped","Windows & glass","Waste removed","Sanitization done","Supplies restocked"].map(c=>`<div><i>✓</i>${c}</div>`).join("")}</div><div id="score" style="margin-top:14px;font-size:26px;color:var(--ink-2)">Score: —</div><div style="margin-top:8px;font-size:22px;color:var(--ink-2)">Timestamped, photo-backed proof of service · Pest-control reminders 7 days ahead</div></div></div></div>`,
 run:el=>{const p=el.querySelectorAll("#pipe span");[1,2,3,4].forEach((i,k)=>setTimeout(()=>p[i].classList.add("on"),2500+k*1500));
  el.querySelectorAll("#chk div").forEach((d,i)=>setTimeout(()=>d.classList.add("on"),1800+i*600));setTimeout(()=>{el.querySelector("#score").innerHTML='Score: <b style="color:var(--ok)">6/6</b> · Supervisor Anita · 09:20'},5600)}},

{dur:9000,cap:["One tap reaches every family — in both languages.","نقرة واحدة تصل إلى كل أسرة — باللغتين."],
 html:`<div style="padding:90px 120px" id="s6"><div class="banner pop" style="width:1000px">🚨 <div><b>Emergency</b> — sent to 1,248 families · push + SMS · English &amp; Arabic</div></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:50px">
   <div class="tile rise d3" style="font-size:28px;line-height:1.6"><b>Important Safety Notification</b><br>The school is following its emergency procedures. Please do not come to the school until further instructions are provided.</div>
   <div class="tile rise d5" style="font-size:30px;line-height:1.7;direction:rtl;text-align:right;font-family:'IBM Plex Sans Arabic','Noto Sans Arabic','Segoe UI',system-ui"><b>إشعار سلامة مهم</b><br>تتبع المدرسة حالياً إجراءات الطوارئ. يرجى عدم الحضور إلى المدرسة حتى صدور تعليمات أخرى.</div></div>
  <div class="rise d7" style="margin-top:44px;display:flex;gap:16px;font-size:26px"><span class="tag bad">🔴 Emergency</span><span class="tag warn">🟠 Urgent</span><span class="tag warn">🟡 Important</span><span class="tag info">🔵 General</span><span class="tag" style="background:var(--maroon-t);color:var(--maroon)">Full RTL Arabic interface</span></div></div>`},

{dur:9000,cls:"dark",cap:["The school pays. Parents never do. Pilots starting now in Qatar.","المدرسة تدفع. وأولياء الأمور لا يدفعون أبداً. برامج تجريبية تبدأ الآن في قطر."],
 html:`<div class="center"><div class="h" style="font-size:64px">Built for private schools in Qatar</div>
  <div style="display:flex;gap:26px;margin-top:10px"><div class="plan pop d1"><b>Starter</b><div class="p">QR 1,000</div><small>per month · up to 500 students</small></div><div class="plan hi pop d3"><b>Professional</b><div class="p">QR 2,500</div><small>per month · 500–1,500 students</small></div><div class="plan pop d5"><b>Enterprise</b><div class="p">Custom</div><small>1,500+ students · multi-campus</small></div></div></div>`},

{dur:8000,cls:"dark",cap:["School360 Qatar — School Management • Parent Services • Facilities","سكول٣٦٠ قطر — إدارة المدرسة • خدمات أولياء الأمور • المرافق"],
 html:`<div class="center"><div class="mark pop">S3</div><div class="h pop d2">School360<small>Book a demo · hellounityfacilities.github.io/school360</small></div></div>`}
];

/* ---------- player ---------- */
let i=-1,timer=null,playing=true,startedAt=0,elapsed=0;
const total=SC.reduce((a,s)=>a+s.dur,0);
function show(n){clearTimeout(timer);i=(n+SC.length)%SC.length;const sc=SC[i];
 const box=$("#scenes");box.innerHTML=`<div class="scene on ${sc.cls||""}">${sc.html}</div>`;
 const el=box.firstChild;const cap=$("#cap");
 $("#capEn").textContent=sc.cap[0];$("#capAr").textContent=sc.cap[1];
 const dark=!!sc.cls;$("#capEn").style.color=dark?"#fff":"var(--ink)";$("#capEn").style.textShadow=dark?"":"none";$("#capAr").style.color=dark?"var(--sand)":"var(--maroon)";
 if(sc.run)sc.run(el);
 startedAt=Date.now();elapsed=0;if(playing)timer=setTimeout(()=>show(i+1),sc.dur);tick()}
function tick(){const done=SC.slice(0,i).reduce((a,s)=>a+s.dur,0)+(playing?Date.now()-startedAt:elapsed);$("#barI").style.width=Math.min(100,done/total*100)+"%";if(playing)requestAnimationFrame(tick)}
function toggle(){playing=!playing;$("#pp").textContent=playing?"Pause":"Play";if(playing){startedAt=Date.now()-elapsed;timer=setTimeout(()=>show(i+1),SC[i].dur-elapsed);tick()}else{clearTimeout(timer);elapsed=Date.now()-startedAt}}
function jump(d){show(i+d)}function restart(){show(0)}
addEventListener("keydown",e=>{if(e.code==="Space"){e.preventDefault();toggle()}if(e.key==="ArrowRight")jump(1);if(e.key==="ArrowLeft")jump(-1);if(e.key==="f"||e.key==="F")document.documentElement.requestFullscreen?.()});
function startPlay(){document.getElementById("tap").style.display="none";playing=true;document.getElementById("pp").textContent="Pause";show(0);document.documentElement.requestFullscreen?.().catch(()=>{})}
playing=false;show(0);clearTimeout(timer);
</script>
